<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment - LifeLine Medicals</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <header></header>

    <div class="section" style="padding-top:120px;">
        <div class="form-container">
            <h2 style="text-align:center; color:var(--primary); margin-bottom:2rem;">Book an Appointment</h2>
            <form onsubmit="submitAppointment(event)">
                <div class="form-group">
                    <label>Select Doctor</label>
                    <select id="doctor-select" name="doctor" class="form-control" required>
                        <option value="">Loading doctors...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="date" class="form-control" required min="2024-01-01">
                </div>

                <div class="form-group">
                    <label>Preferred Time</label>
                    <input type="time" name="time" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Reason for Visit</label>
                    <textarea name="reason" class="form-control" rows="3" placeholder="Briefly describe your symptoms"></textarea>
                </div>

                <button type="submit" class="cta-btn btn-block">Confirm Appointment</button>
            </form>
        </div>
    </div>

    <footer></footer>
    <script src="assets/js/app.js"></script>
    <script>
        // Set min date to today
        const today = new Date().toISOString().split('T')[0];
        document.querySelector('input[name="date"]').min = today;
        
        // Check URL params for pre-selected doctor
        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('doctor');
        if(docId) {
            setTimeout(() => {
                const select = document.getElementById('doctor-select');
                if(select) select.value = docId;
            }, 500); // Small delay to let JS populate mock data
        }
    </script>
</body>
</html>
