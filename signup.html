<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - LifeLine Medicals</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body style="background:var(--bg-light);">
    <header></header>

    <div class="section" style="padding-top:120px; min-height:90vh; display:flex; align-items:center; justify-content:center;">
        <div class="form-container" style="width:100%; margin:0;">
            <div style="text-align:center; margin-bottom:2rem;">
                <h2 style="color:var(--primary); margin-bottom:0.5rem;">Welcome Back</h2>
                <p style="color:var(--text-light)">Access your dashboard and appointments</p>
            </div>

            <!-- Tabs -->
            <div style="display:flex; margin-bottom:2rem; border-bottom:2px solid #e2e8f0;">
                <button onclick="toggleAuth('login')" id="tab-login" style="flex:1; padding:1rem; border:none; background:none; font-weight:600; cursor:pointer; color:var(--primary); border-bottom:2px solid var(--primary); margin-bottom:-2px;">Sign In</button>
                <button onclick="toggleAuth('signup')" id="tab-signup" style="flex:1; padding:1rem; border:none; background:none; font-weight:600; cursor:pointer; color:var(--text-light);">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="user@lifeline.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="user">
                </div>
                <button type="submit" class="cta-btn btn-block">Sign In</button>
                <p style="text-align:center; margin-top:1rem; font-size:0.9rem; color:var(--text-light);">
                    Demo User: user@lifeline.com | user<br>
                    Demo Admin: admin@lifeline.com | admin
                </p>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" style="display:none;" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="cta-btn btn-block">Create Account</button>
            </form>
        </div>
    </div>

    <footer></footer>
    <script src="assets/js/app.js"></script>
    <script>
        function toggleAuth(type) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');

            if (type === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                loginTab.style.color = 'var(--primary)';
                loginTab.style.borderBottom = '2px solid var(--primary)';
                signupTab.style.color = 'var(--text-light)';
                signupTab.style.borderBottom = 'none';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                signupTab.style.color = 'var(--primary)';
                signupTab.style.borderBottom = '2px solid var(--primary)';
                loginTab.style.color = 'var(--text-light)';
                loginTab.style.borderBottom = 'none';
            }
        }
    </script>
</body>
</html>
